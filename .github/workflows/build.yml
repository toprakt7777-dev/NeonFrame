name: Build Windows x64
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt pyinstaller==6.12.0
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Build executable
        run: pyinstaller --noconfirm --clean --windowed --name NeonFrame --collect-all cv2 --collect-all PySide6 main.py
      - name: Package ZIP
        run: Compress-Archive -Path dist/NeonFrame/* -DestinationPath NeonFrame-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: NeonFrame-Windows-x64
          path: NeonFrame-Windows-x64.zip
          if-no-files-found: error
